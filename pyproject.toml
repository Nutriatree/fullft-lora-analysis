[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fullft-lora-analysis"
version = "0.1.0"
description = "Performance, efficiency, and adaptation analysis of Full FT and LoRA."
requires-python = ">=3.10"

[project.optional-dependencies]
analysis = ["matplotlib>=3.8,<4.0"]
dev = ["ruff>=0.11,<1", "coverage>=7,<8"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.setuptools.packages.find]
where = ["src"]
