[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pubmedqa-fine-tune"
version = "0.1.0"
description = "PubMedQA baseline, full fine-tune, and LoRA experiments."
requires-python = ">=3.10"

[project.optional-dependencies]
analysis = ["matplotlib>=3.8,<4.0"]

[tool.setuptools.packages.find]
where = ["src"]
